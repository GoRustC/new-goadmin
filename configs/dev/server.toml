[General]
AppName = "ginadmin"
Version = "v10.1.0"
Debug = true
PprofAddr = "" # Pprof monitor address, "localhost:6060"
MetricsAddr = "" # Prometheus metrics address, e.g. "127.0.0.1:8041"
DisableSwagger = false
DisablePrintConfig = false
# Password for new users created without one and for password resets; empty disables both.
# MD5("abc-123") is accepted in debug mode only.
DefaultLoginPwd = "6351623c8cef86fefabfa7da046fc619"
MenuFile = "menu.json" # Or use "menu_cn.json"
DenyOperateMenu = true

[General.HTTP]
Addr = ":8040"
ShutdownTimeout = 10
ReadTimeout = 60
WriteTimeout = 60
IdleTimeout = 10
ReadHeaderTimeout = 10 # seconds
MaxHeaderBytes = 1048576 # 1MB
CertFile = ""
KeyFile = ""
# Reverse proxies allowed to set X-Forwarded-For, e.g. ["127.0.0.1", "10.0.0.0/8"].
# Empty trusts none: the client IP is the TCP peer address.
TrustedProxies = []

[General.Root] # Super Administrator Account
ID = "root"
Username = "admin"
# MD5 hash as sent by the frontend, or a bcrypt hash of it; empty disables root login.
# MD5("abc-123") is accepted in debug mode only. In production, inject it through an
# environment variable reference (syntax documented in internal/config/env.go).
Password = "6351623c8cef86fefabfa7da046fc619"
Name = "Admin"

[Storage]

[Storage.Cache]
Type = "memory" # memory/badger/redis
Delimiter = ":"

[Storage.Cache.Memory]
CleanupInterval = 60

[Storage.Cache.Badger]
Path = "data/cache"

[Storage.Cache.Redis]
Addr = "127.0.0.1:6379"
Username = ""
Password = ""
DB = 1

[Storage.DB]
Debug = true
Type = "sqlite3" # sqlite3/mysql/postgres
# SQLite3 DSN
DSN = "data/ginadmin.db"
# MySQL DSN
# DSN = "root:123@tcp(127.0.0.1:3306)/ginadmin?charset=utf8mb4&parseTime=True&loc=Local"
# PostgreSQL DSN
# DSN = "host=db user=postgres password=123456 dbname=ginadmin port=5432 sslmode=disable TimeZone=Asia/Shanghai"
MaxLifetime = 86400
MaxIdleTime = 3600
MaxOpenConns = 100
MaxIdleConns = 50
TablePrefix = ""
AutoMigrate = true

[Util]

[Util.Captcha]
Length = 4
Width = 400
Height = 160
CacheType = "memory" # memory/redis

[Util.Captcha.Redis]
Addr = "" # If empty, then use the same configuration as Storage.Cache.Redis
Username = ""
Password = ""
DB = 1
KeyPrefix = "captcha:"

[Dictionary]
UserCacheExp = 4 # hours
