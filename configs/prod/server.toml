# Production configuration sample.
#
# Secrets and addresses are read from environment variables. Startup fails if a
# required variable is missing or if the configuration does not validate.
#
#   Required:  GINADMIN_DB_DSN, GINADMIN_REDIS_ADDR, GINADMIN_JWT_KEY, GINADMIN_ROOT_PASSWORD
#   Optional:  GINADMIN_HTTP_ADDR (default :8040), GINADMIN_DB_TYPE (default mysql),
#              GINADMIN_REDIS_USERNAME, GINADMIN_REDIS_PASSWORD, GINADMIN_DEFAULT_LOGIN_PWD,
#              GINADMIN_METRICS_ADDR (default 127.0.0.1:8041)
#
# Start with: ginadmin start -d configs -c prod

[General]
AppName = "ginadmin"
Version = "v10.1.0"
Debug = false
PprofAddr = "" # Keep empty, or bind to localhost only, e.g. "localhost:6060"
# Prometheus metrics at http://<addr>/metrics. Keep it off the public network;
# set GINADMIN_METRICS_ADDR to a private address if Prometheus runs elsewhere,
# or to "" to disable.
MetricsAddr = "${GINADMIN_METRICS_ADDR:-127.0.0.1:8041}"
DisableSwagger = true
DisablePrintConfig = true # Multi-line output confuses line-based log collectors; secrets are masked if enabled
# Password (MD5 hash, as sent by the frontend) for new users created without one and
# for password resets. Empty disables both.
DefaultLoginPwd = "${GINADMIN_DEFAULT_LOGIN_PWD:-}"
MenuFile = "menu.json"
DenyOperateMenu = true

[General.HTTP]
Addr = "${GINADMIN_HTTP_ADDR:-:8040}"
ShutdownTimeout = 10
ReadTimeout = 60
WriteTimeout = 60
IdleTimeout = 75 # Longer than a reverse proxy keepalive (nginx: 60s), avoiding sporadic 502s
ReadHeaderTimeout = 10 # seconds
MaxHeaderBytes = 1048576 # 1MB
CertFile = ""
KeyFile = ""
# Reverse proxies allowed to set X-Forwarded-For. Behind nginx or a load
# balancer this MUST list them, e.g. ["127.0.0.1"] or ["10.0.0.0/8"]: otherwise
# every client appears as the proxy and shares one rate limit bucket.
TrustedProxies = []

[General.LoginLock]
MaxFailures = 5 # failed logins before an account name is locked
LockMinutes = 15

[General.Root] # Super Administrator Account
ID = "root"
Username = "admin"
# bcrypt hash from "ginadmin hash-password" (a plain MD5 is refused here). Empty disables root login.
Password = "${GINADMIN_ROOT_PASSWORD}"
Name = "Admin"

[Storage]

[Storage.Cache]
# Redis is required for more than one instance: user cache and casbin reload
# signals must be shared.
Type = "redis"
Delimiter = ":"
KeyPrefix = "ginadmin:" # set a distinct prefix per application or environment sharing this Redis

[Storage.Cache.Redis]
Addr = "${GINADMIN_REDIS_ADDR}"
Username = "${GINADMIN_REDIS_USERNAME:-}"
Password = "${GINADMIN_REDIS_PASSWORD:-}"
DB = 1

[Storage.DB]
Debug = false
Type = "${GINADMIN_DB_TYPE:-mysql}" # mysql/postgres
# Include timeouts, so a network failure fails requests instead of hanging them:
# MySQL:    user:pass@tcp(host:3306)/ginadmin?charset=utf8mb4&parseTime=True&loc=Local&timeout=5s&readTimeout=30s&writeTimeout=30s
# Postgres: host=db user=ginadmin password=xxx dbname=ginadmin port=5432 sslmode=require connect_timeout=5
DSN = "${GINADMIN_DB_DSN}"
MaxLifetime = 86400
MaxIdleTime = 3600
# Keep instances x (MaxOpenConns + log hook MaxOpenConns) below the database's
# max_connections (MySQL default 151, PostgreSQL default 100).
MaxOpenConns = 25
MaxIdleConns = 10
TablePrefix = ""
AutoMigrate = true # Creates and extends tables; never drops columns

[Util]

[Util.Captcha]
Length = 4
Width = 400
Height = 160
# Captchas are stored in Redis, so any instance can verify them.
CacheType = "redis"

[Util.Captcha.Redis]
Addr = "" # Empty uses Storage.Cache.Redis
Username = ""
Password = ""
DB = 1
KeyPrefix = "captcha:"

[Dictionary]
UserCacheExp = 4 # hours
LoggerRetentionDays = 90 # delete logger table rows older than this; 0 keeps all
